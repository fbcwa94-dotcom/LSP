{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Blog | SL Producciones{% endblock %}</title>
  {% block meta %}<meta name="description" content="Ideas, tendencias y consejos para fiestas de fin de año y eventos corporativos.">{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --amarillo:#FFC20E; --negro:#1E1E1E; --crema:#F4F3EE; --gris:#5C5C5C; --borde:#DEDBD2;
            --f-titulo:"Archivo","Arial Narrow",Arial,sans-serif; --f-texto:"Poppins",Arial,sans-serif; }
    *,*::before,*::after { box-sizing:border-box; }
    body { margin:0; font-family:var(--f-texto); color:var(--negro); background:var(--crema); line-height:1.6; }
    a { color:inherit; text-decoration:none; }
    img { max-width:100%; display:block; }
    h1,h2,h3 { font-family:var(--f-titulo); font-stretch:70%; font-weight:800; line-height:1; letter-spacing:-.01em; margin:0; }
    .cont { width:min(1100px, 100% - 3rem); margin-inline:auto; }
    a:focus-visible { outline:3px solid var(--amarillo); outline-offset:3px; }
    .amarillo { color:var(--amarillo); }

    .cab { background:var(--negro); color:#fff; padding:1.1rem 0; }
    .cab .cont { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .logo { font-family:var(--f-titulo); font-stretch:70%; font-weight:800; font-size:1.5rem; }
    .logo span { color:var(--amarillo); }
    .cab nav { display:flex; align-items:center; gap:1.6rem; font-size:.85rem; }
    .cab nav a:hover { color:var(--amarillo); }
    .btn { display:inline-block; background:var(--amarillo); color:var(--negro) !important; font-weight:600; font-size:.85rem; padding:.6rem 1.4rem; border-radius:999px; }
    .pie { background:var(--negro); color:#BDBDBD; text-align:center; font-size:.8rem; padding:1.6rem 1rem; margin-top:4rem; }
    {% block estilos %}{% endblock %}
  </style>
</head>
<body>
  <header class="cab">
    <div class="cont">
      <!-- ▼▼▼ IMAGEN: LOGO (reemplaza este texto por <img src="{% static 'img/logo-sl.png' %}" alt="SL Producciones"> cuando lo tengas) ▼▼▼ -->
      <a class="logo" href="{% url 'landing' %}">SL <span>Producciones</span></a>
      <nav aria-label="Principal">
        <a href="{% url 'landing' %}">Inicio</a>
        <a href="{% url 'blog_lista' %}">Blog</a>
        <a class="btn" href="{% url 'landing' %}#contacto">Hablemos de tu evento</a>
      </nav>
    </div>
  </header>

  <main>{% block contenido %}{% endblock %}</main>

  <footer class="pie">© SL Producciones · Fiestas de fin de año y eventos corporativos en Colombia</footer>
</body>
</html>
