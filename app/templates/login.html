<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Panel de registros</title>
  <style>
    :root { --amarillo: #FFC20E; --negro: #1E1E1E; --crema: #F4F3EE; --gris: #6B6B6B; --error: #B3261E; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      font-family: "Poppins", Arial, sans-serif; background: var(--negro); color: var(--negro);
    }
    .tarjeta { width: min(400px, 100%); background: var(--crema); border-radius: 20px; padding: 2.2rem 2rem; border-top: 8px solid var(--amarillo); }
    h1 { margin: 0 0 .3rem; font-size: 1.6rem; }
    .sub { margin: 0 0 1.5rem; font-size: .85rem; color: var(--gris); }
    label { display: block; font-size: .8rem; font-weight: 600; margin: 1rem 0 .35rem; }
    input[type=text], input[type=password] {
      width: 100%; border: 1px solid #D6D3C9; border-radius: 999px; padding: .75rem 1rem;
      font: inherit; font-size: .9rem; background: #fff;
    }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
    button {
      width: 100%; margin-top: 1.5rem; border: 0; border-radius: 999px; padding: .8rem 1rem;
      font: inherit; font-weight: 600; font-size: .9rem; background: var(--negro); color: #fff; cursor: pointer;
    }
    button:hover { background: #000; }
    .error { margin: 0 0 1rem; padding: .7rem 1rem; border-radius: 12px; background: #FBE4E2; color: var(--error); font-size: .82rem; }
  </style>
</head>
<body>
  <main class="tarjeta">
    <h1>Panel de registros</h1>
    <p class="sub">Ingresa con tu usuario para ver los datos capturados.</p>

    {% if form.errors %}
      <p class="error" role="alert">Usuario o contraseña incorrectos, o sin permiso de acceso. Inténtalo de nuevo.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <label for="id_username">Usuario</label>
      <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>

      <label for="id_password">Contraseña</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>

      <button type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
